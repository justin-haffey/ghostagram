# Portable Codex configuration for a child solution repository.
suppress_unstable_features_warning = true
allow_login_shell = true

[agents]
max_concurrent_threads_per_session = 8

[agents.codex_engineer]
description = "Design, revise, and validate Codex plugins, skills, custom agents, and prompt-rich repository instructions."
config_file = "agents/codex/codex-engineer.toml"

[agents.repo_author]
description = "Author repository-scoped AGENTS.md governance and factual README.md documentation."
config_file = "agents/swe/repo-author.toml"

[agents.solution_architect]
description = "Own solution architecture and coordinate package and module architecture within this repository."
config_file = "agents/swe/solution-architect.toml"

[agents.package_architect]
description = "Own architecture for one named package and its module boundaries."
config_file = "agents/swe/package-architect.toml"

[agents.module_architect]
description = "Own architecture for one module nested under its package."
config_file = "agents/swe/module-architect.toml"

[agents.solution_developer]
description = "Implement feature designs that span packages in this solution."
config_file = "agents/swe/solution-developer.toml"

[agents.package_developer]
description = "Implement a feature slice within one named package and its tests."
config_file = "agents/swe/package-developer.toml"

[agents.module_developer]
description = "Implement a focused change within one named module and its tests."
config_file = "agents/swe/module-developer.toml"

[agents.integration_engineer]
description = "Verify package, module, external, and upstream-contract integration behavior."
config_file = "agents/swe/integration-engineer.toml"

[agents.architecture_reviewer]
description = "Independently review and, when authorized, approve architecture artifacts and decisions."
config_file = "agents/swe/architecture-reviewer.toml"

[agents.solution_validator]
description = "Independently validate solution-local Feature assignments and governed fast-path delivery evidence."
config_file = "agents/swe/solution-validator.toml"

[agents.azure_engineer]
description = "Engineer Azure infrastructure and operations within accepted solution architecture."
config_file = "agents/swe/azure-engineer.toml"

[agents.azure_db_developer]
description = "Implement Azure SQL and Cosmos DB data designs within accepted package or module boundaries."
config_file = "agents/swe/azure-db-developer.toml"

[agents.csharp_developer]
description = "Implement and validate focused C#/.NET changes from accepted feature designs."
config_file = "agents/swe/csharp-developer.toml"

[agents.full_stack_developer]
description = "Implement coordinated frontend, API, service, and persistence changes."
config_file = "agents/swe/full-stack-developer.toml"

[agents.maf_developer]
description = "Implement Microsoft Agent Framework agents, tools, orchestration, and evaluations."
config_file = "agents/swe/maf-developer.toml"

[agents.ui_designer]
description = "Design and validate usable, responsive interfaces within accepted product and feature intent."
config_file = "agents/swe/ui-designer.toml"

[agents.code_commenter]
description = "Improve code-local documentation without changing runtime behavior."
config_file = "agents/swe/code-commenter.toml"

[agents.test_runner]
description = "Execute bounded repository checks through swe-test using Luna at medium."
config_file = "agents/swe/test-runner.toml"

[features]
multi_agent = true
multi_agent_v2 = true
shell_tool = true

[mcp_servers.microsoft_learn]
url = "https://learn.microsoft.com/api/mcp"

[mcp_servers.ghostagram]
url = "http://127.0.0.1:5256/mcp"
enabled = true
required = false
startup_timeout_sec = 20.0
tool_timeout_sec = 60.0
enabled_tools = [
  "describe_capabilities",
  "list_diagrams",
  "open_session",
  "create_diagram",
  "get_diagram",
  "apply_operations",
  "layout_diagram",
  "export_svg",
  "close_session",
]
